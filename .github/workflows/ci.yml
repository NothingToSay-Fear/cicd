name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查代码规范
        run: npm run lint

      - name: 类型检查并构建
        run: npm run build